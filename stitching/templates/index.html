<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Stitching</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header>
    <h1><svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="5" width="15" height="18" rx="3"/><rect x="11" y="2" width="15" height="18" rx="3"/></svg><span data-i18n="title">Image Stitching</span></h1>
    <div class="languages" role="group" data-i18n-aria="language" aria-label="Language">
      <button id="lang-zh" type="button" lang="zh-CN" aria-pressed="false">中文</button>
      <button id="lang-en" type="button" lang="en" aria-pressed="true">EN</button>
    </div>
  </header>
  <main>
    <form id="stitch-form">
      <div class="inputs">
        <label class="upload" id="left-card">
          <span class="card-label" data-i18n="left">Left</span>
          <input id="image1" type="file" accept="image/*" data-i18n-aria="chooseLeft" aria-label="Choose left image">
          <span class="placeholder"><span class="plus" aria-hidden="true">+</span><span data-i18n="choose">Choose image</span></span>
          <img id="preview1" data-i18n-alt="leftPreview" alt="Left image preview" hidden>
          <span class="filename" id="filename1"></span>
        </label>
        <button class="swap" id="swap" type="button" data-i18n-aria="swap" aria-label="Swap images" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4-4-4 4 4 4"/></svg>
        </button>
        <label class="upload" id="right-card">
          <span class="card-label" data-i18n="right">Right</span>
          <input id="image2" type="file" accept="image/*" data-i18n-aria="chooseRight" aria-label="Choose right image">
          <span class="placeholder"><span class="plus" aria-hidden="true">+</span><span data-i18n="choose">Choose image</span></span>
          <img id="preview2" data-i18n-alt="rightPreview" alt="Right image preview" hidden>
          <span class="filename" id="filename2"></span>
        </label>
      </div>
      <div class="toolbar">
        <p class="limits" data-i18n="limits">Left ≥ 800 px · Total ≤ 32 MiB</p>
        <div class="actions">
          {% if sample_available %}<button class="secondary" id="sample" type="button" data-i18n="sample">Try example</button>{% endif %}
          <button class="primary" id="submit" type="submit" data-i18n="stitch" disabled>Stitch</button>
        </div>
      </div>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <a id="error-report" class="text-link" data-i18n="report" download hidden>Download report</a>
    <section id="results" hidden>
      <div class="result-toolbar">
        <span id="output-size"></span>
        <a id="download-panorama" class="primary" data-i18n="download" download>Download PNG</a>
      </div>
      <div class="viewer"><img id="result-image" data-i18n-alt="panoramaPreview" alt="Panorama preview"></div>
      <details id="details">
        <summary><span data-i18n="details">Details</span><span aria-hidden="true">+</span></summary>
        <div class="detail-body">
          <div class="metrics">
            <div><span data-i18n="matches">Matches</span><strong id="metric-matches"></strong></div>
            <div><span data-i18n="inliers">Inlier ratio</span><strong id="metric-ratio"></strong></div>
            <div><span data-i18n="error">Median error</span><strong id="metric-error"></strong></div>
          </div>
          <p id="geometry-note" class="note" data-i18n="clipped" hidden>Some edges extend beyond the canvas and may be cropped.</p>
          <img id="matching-image" data-i18n-alt="matchingPreview" alt="Feature matches" hidden>
          <a id="download-report" class="text-link" data-i18n="report" download>Download report</a>
        </div>
      </details>
    </section>
    <noscript>Please enable JavaScript. / 请启用 JavaScript。</noscript>
  </main>
</body>
</html>
