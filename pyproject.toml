[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image-stitching-opencv"
version = "0.2.0"
description = "Two-image stitching using SIFT, homography and weighted blending"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
]

[project.scripts]
image-stitching = "stitching.cli:cli"
image-stitching-web = "stitching.web:cli"
image-stitching-benchmark = "stitching.benchmark:cli"

[project.optional-dependencies]
web = ["flask>=3.1,<4"]
benchmark = ["psutil>=6,<8"]

[tool.setuptools]
py-modules = ["Image_Stitching"]

[tool.setuptools.packages.find]
include = ["stitching*"]

[tool.setuptools.package-data]
stitching = ["templates/*.html", "static/*.css", "static/*.js"]
