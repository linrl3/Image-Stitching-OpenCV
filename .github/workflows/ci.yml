name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.17"

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Run tests
        env:
          STITCHING_ARTIFACT_DIR: output/regression
          STITCHING_FULL_SAMPLE: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && '1' || '' }}
        run: uv run --locked --all-extras python -m unittest discover -s tests -v
      - name: Verify installed command
        run: uv run --locked --all-extras image-stitching --help
      - name: Record performance sample
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: >-
          uv run --locked --all-extras image-stitching-benchmark
          images/q11.jpg images/q22.jpg --scales .5 1 --repeats 1
          --output output/regression/benchmark.json
      - name: Record full web memory sample
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: >-
          uv run --locked --all-extras python benchmarks/web_memory.py
          --output output/regression/web-memory.json
      - name: Upload regression previews and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-${{ matrix.os }}-py${{ matrix.python-version }}
          path: output/regression/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build and verify distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build source distribution and wheel
        run: uv build --no-sources
      - name: Verify wheel in a clean environment outside the checkout
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/wheel-smoke"
          wheel_python="$RUNNER_TEMP/wheel-smoke/bin/python"
          uv export --locked --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/requirements.txt" --quiet
          uv pip install --python "$wheel_python" --require-hashes \
            -r "$RUNNER_TEMP/requirements.txt"
          uv pip install --python "$wheel_python" --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/image-stitching" --help
          "$wheel_python" - <<'PY'
          import numpy as np
          from stitching import stitch
          from stitching.io import to_uint8
          from Image_Stitching import Image_Stitching
          image = np.random.default_rng(42).integers(0, 256, (96, 1000, 3), dtype=np.uint8)
          np.testing.assert_array_equal(to_uint8(stitch(image, image).panorama), image)
          PY
      - name: Verify optional web assets in the installed wheel
        shell: bash
        run: |
          wheel_python="$RUNNER_TEMP/wheel-smoke/bin/python"
          uv export --locked --all-extras --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/extras.txt" --quiet
          uv pip install --python "$wheel_python" --require-hashes -r "$RUNNER_TEMP/extras.txt"
          cd "$RUNNER_TEMP"
          "$wheel_python" - <<'PY'
          from stitching.web import create_app
          client = create_app().test_client()
          for path in ('/', '/static/style.css', '/static/app.js'):
              with client.get(path) as response:
                  assert response.status_code == 200, path
                  assert len(response.data) > 100, path
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
